# InferForge log rotation (system logrotate)
#
# Install:
#   1. copy this file to /etc/logrotate.d/inferforge
#   2. replace /path/to/InferForge with the actual project path
#   3. dry-run check: logrotate -d /etc/logrotate.d/inferforge
#
# copytruncate keeps the same inode: every writer process (gunicorn master +
# workers, celery worker children) keeps appending to the same file while it
# is rotated — no multi-process rotation races, no dropped lines.

/path/to/InferForge/logs/*.log {
    daily
    rotate 7
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
}
