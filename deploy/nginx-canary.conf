# InferForge canary traffic split — reference example
#
# Install:
#   1. copy this file to /etc/nginx/conf.d/inferforge-canary.conf
#   2. replace the upstream addresses with your web instances
#   3. nginx -t && systemctl reload nginx
#
# Design (why web grayscale + worker full rollout is safe — see
# docs/deployment.md §2): the {code, message, data} envelope is a
# cross-version stable contract, so old/new web and workers interoperate.
# The worker fleet is fully rolled BEFORE web traffic moves; this config
# splits web traffic only.
#
# Ramp: edit the weights 90/10 -> 70/30 -> retire the old server, matching
# the 10% -> 30% -> 100% order in docs/deployment.md §2.4.

# --- weighted split: both versions in ONE upstream group ------------------
# Weights only take effect within a single group — two separate upstream
# groups with weights would split nothing.
upstream inferforge_web {
    server 127.0.0.1:8001 weight=90;   # current version (prod-web)
    server 127.0.0.1:8002 weight=10;   # new version (canary-web)
}

# --- optional: pin a request to canary via header -------------------------
# X-Canary: 1 forces the request to the canary instance (fixed-point
# verification during the ramp). Delete this map + upstream and proxy_pass
# http://inferforge_web directly if you only need the weight split.
upstream inferforge_canary_only {
    server 127.0.0.1:8002;
}

map $http_x_canary $backend {
    default          inferforge_web;
    "1"              inferforge_canary_only;
}

server {
    listen 80;
    server_name _;

    # match the app's 20MB request-body ceiling (ContentLengthLimitMiddleware)
    # so oversized bodies get the 200 + code=1 envelope instead of nginx's 413
    client_max_body_size 20m;

    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Request-ID: generated by the app (utils/request_id.py) and echoed
        # on every response; client-supplied ids pass through unchanged.

        # inference is long-running: nginx's default 60s read timeout would
        # cut slow requests. The app's gunicorn timeout=60 is an event-loop
        # watchdog, not a request deadline (docs/stack.md §1.3).
        proxy_read_timeout 300s;
    }
}

# Health checks: open-source nginx has NO active HTTP probes — point your
# LB / orchestrator at the app's /health and /health/ready instead; the
# readiness probe keeps cold-started instances out of rotation
# (docs/deployment.md §2.5).
