# Prometheus scrape config for the monitoring stack (reference artifact).
#
# Loaded by deploy/docker-compose.monitoring.yml. The single target is the
# web service: its /metrics endpoint aggregates the web's own metrics plus
# the celery worker's files via the shared PROMETHEUS_MULTIPROC_DIR.
#
# Bare-metal: replace web:8000 with your host, e.g. localhost:8000.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: inferforge
    static_configs:
      - targets: ["web:8000"]
