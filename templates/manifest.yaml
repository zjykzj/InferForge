# Bootstrap assembly manifest — the positive include-list for selective
# project generation (docs/workflow/bootstrap.md §2). Consumed by
# scripts/assemble.py; guarded by tests/test_bootstrap_manifest.py
# (every tracked repo file is claimed exactly once; marker blocks pair up).
#
# Selection model:
#   base         — always copied: the MINIMAL serving shell — app factory,
#                  health probes, metrics router, cross-cutting utils
#                  (envelope, logging, request-id, auth, rate limit) and
#                  the contract tests. NO capability, NO template identity
#                  files (README/CHANGELOG/LICENSE/VERSION/CLAUDE.md are
#                  GENERATED for the new project, never copied — see
#                  bootstrap.md §3), NO docs (the template dir stays the
#                  reference library) except docs/status-codes.md, which
#                  is part of the envelope contract the guard tests check.
#   capabilities — one file set each; opt-in via --with; `requires` expands
#                  the dependency closure automatically.
#   shared       — included when ANY of the listed capabilities is selected:
#                  serving-stack (engines, registry, start.sh, preflight —
#                  the model-serving infrastructure) and http-stack (request
#                  schemas, image conversion — needed by every HTTP
#                  business capability).
#   features     — deployment/tooling extras; opt-in via --features.
#   template     — template-identity assets and the knowledge library:
#                  NEVER assembled. The template is the reference, not a
#                  copy source — new projects get their identity files
#                  GENERATED (bootstrap.md §3) and read the docs from the
#                  template directory.
#
# Wiring files (app.py, apis/health.py, engines/registry.py, ...) carry
# `# @inferforge:<name>` ... `# @inferforge:end:<name>` marker blocks for
# capability-specific code; assemble.py drops the blocks of unselected
# capabilities so a generated project never references absent files.

base:
  - .env.example
  - .gitignore
  - app.py
  - apis/__init__.py
  - apis/health.py
  - apis/metrics.py
  - conftest.py
  - requirements.txt
  - tests/__init__.py
  - tests/test_architecture.py
  - tests/test_logger.py
  - utils/__init__.py
  - utils/auth.py
  - utils/logger.py
  - utils/metrics.py
  - utils/rate_limit.py
  - utils/request_id.py
  - utils/response.py
  - utils/switches.py

capabilities:
  detect:
    requires: []
    files:
      - apis/sync_detect.py
      - assets/
      - engines/yolo.py
      - scripts/run_detection.py
      - scripts/test_sync_detect.py
      - tasks/detection.py
      - tasks/warmup.py
      - tests/test_auth.py
      - tests/test_health.py
      - tests/test_metrics.py
      - tests/test_preload.py
      - tests/test_rate_limit.py
      - tests/test_registry.py
      - tests/test_sync_detect.py
  seg:
    requires: [detect]
    files:
      - apis/sync_segment.py
      - engines/yolo_seg.py
      - scripts/run_segment.py
      - scripts/test_sync_segment.py
      - tasks/segmentation.py
      - tests/test_sync_segment.py
      - tests/test_yolo_seg_engine.py
  cls:
    requires: []
    files:
      - apis/sync_classify.py
      - engines/imagenet_classes.py
      - engines/yolo_cls.py
      - scripts/run_classify.py
      - scripts/test_sync_classify.py
      - tasks/classification.py
      - tests/test_sync_classify.py
      - tests/test_yolo_cls_engine.py
  pipeline:
    requires: [detect, cls]
    files:
      - apis/sync_pipeline.py
      - scripts/run_pipeline.py
      - scripts/test_sync_pipeline.py
      - tasks/pipeline.py
      - tests/test_sync_pipeline.py
  embed:
    requires: []
    files:
      - docs/embedding.md
      - engines/dinov2.py
      - scripts/export_dinov2.py
      - tasks/embedding.py
  dedup:
    requires: [embed]
    files:
      - apis/sync_dedup.py
      - scripts/run_dedup.py
      - scripts/test_sync_dedup.py
      - tasks/dedup.py
      - tests/test_dedup.py
  async:
    requires: [detect]
    files:
      - apis/async_detect_callback.py
      - apis/async_detect_query.py
      - celery_app.py
      - requirements-async.txt
      - scripts/callback_receiver.py
      - scripts/test_async_detect_callback.py
      - scripts/test_async_detect_query.py
      - start_celery.sh
      - tasks/detection_callback.py
      - tasks/detection_query.py
      - tests/test_app.py
      - tests/test_async_detect_callback.py
      - tests/test_async_detect_query.py
      - utils/redis_store.py
  vlm:
    requires: [async]
    files:
      - apis/async_vlm_query.py
      - scripts/run_vlm.py
      - scripts/test_async_vlm_query.py
      - tasks/vlm.py
      - tasks/vlm_query.py
      - tests/test_async_vlm_query.py
      - tests/test_vlm.py
  agent:
    requires: [detect, async]
    files:
      - apis/async_agent_query.py
      - docs/agent.md
      - scripts/run_agent.py
      - tasks/agent.py
      - tasks/agent_query.py
      - tests/test_agent.py
      - tests/test_async_agent_query.py
  search:
    requires: [embed, async]
    files:
      - apis/async_search_check.py
      - apis/async_search_query.py
      - scripts/build_gallery.py
      - scripts/run_search.py
      - tasks/search.py
      - tasks/search_check_query.py
      - tasks/search_query.py
      - tests/test_async_search_check.py
      - tests/test_async_search_query.py
      - tests/test_search.py

shared:
  - any_of: [detect, seg, cls, embed]
    files:
      - engines/__init__.py
      - engines/base.py
      - engines/registry.py
      - utils/errors.py
      - gunicorn.conf.py
      - models/.gitkeep
      - models/registry.example.yaml
      - scripts/check_capability.py
      - scripts/preflight_models.py
      - start.sh
      - tasks/__init__.py
  - any_of: [detect, seg, cls, pipeline, embed, dedup, async, vlm, agent, search]
