# Bootstrap assembly manifest — the positive include-list for selective
# project generation (docs/workflow/bootstrap.md §2). Consumed by
# scripts/assemble.py; guarded by tests/test_bootstrap_manifest.py
# (every tracked repo file is claimed exactly once; marker blocks pair up).
#
# Three-layer model:
#   base         — always copied: the CONTRACT KERNEL. app factory +
#                  envelope + health probes + placeholder packages
#                  (tasks/engines) + the contract guard tests. NO
#                  mechanism, NO capability, NO template identity files.
#   mechanisms   — cross-cutting middleware pieces, opt-in: metrics,
#                  request_id, auth, rate_limit, logging. Each entry
#                  carries its files AND its pip requirements — the
#                  generated requirements.txt is the MERGE of selected
#                  entries, never a copy of the template's.
#   capabilities — business capabilities, opt-in; `requires` expands the
#                  dependency closure automatically.
#   shared       — included when ANY of the listed names is selected
#                  (serving-stack: engines/registry/start.sh/preflight;
#                  http-stack: schemas/image utils).
#   features     — deployment/tooling extras, opt-in (ci/docker/deploy/
#                  benchmark).
#   template     — template identity + knowledge library: NEVER assembled
#                  (new projects GENERATE identity per bootstrap.md §3).
#   generated    — files assemble.py WRITES from manifest data instead of
#                  copying (requirements.txt = merged dependency set).
#
# Wiring files carry `# @inferforge:<name>` ... `# @inferforge:end:<name>`
# marker blocks (capability/mechanism/feature names; compound a+b = AND);
# assemble.py strips the blocks of unselected names.

base:
  files:
    - .env.example
    - .gitignore
    - apis/__init__.py
    - apis/health.py
    - app.py
    - conftest.py
    - engines/__init__.py
    - tasks/__init__.py
    - tests/__init__.py
    - tests/test_architecture.py
    - utils/__init__.py
    - utils/request_id.py
    - utils/response.py
    - utils/switches.py
  requirements:
    - fastapi>=0.141,<1.0
    - httpx>=0.28,<0.29
    - pydantic>=2.13,<3.0
    - pytest>=8.0
    - python-dotenv>=1.0,<2.0
    - uvicorn>=0.52,<1.0

mechanisms:
  metrics:
    files:
      - apis/metrics.py
      - tests/test_metrics.py
      - utils/metrics.py
    requirements:
      - prometheus_client>=0.21,<1.0
  auth:
    files:
      - tests/test_auth.py
      - utils/auth.py
  rate_limit:
    files:
      - tests/test_rate_limit.py
      - utils/rate_limit.py
  logging:
    files:
      - tests/test_logger.py
      - utils/logger.py

capabilities:
  detect:
    requires: []
    files:
      - apis/sync_detect.py
      - assets/
      - engines/yolo.py
      - scripts/run_detection.py
      - scripts/test_sync_detect.py
      - tasks/detection.py
      - tasks/warmup.py
      - tests/test_health.py
      - tests/test_preload.py
      - tests/test_registry.py
      - tests/test_sync_detect.py
    requirements:
      - numpy>=1.26
      - onnxruntime>=1.17
      - opencv-python>=4.9
  seg:
    requires: [detect]
    files:
      - apis/sync_segment.py
      - engines/yolo_seg.py
      - scripts/run_segment.py
      - scripts/test_sync_segment.py
      - tasks/segmentation.py
      - tests/test_sync_segment.py
      - tests/test_yolo_seg_engine.py
  cls:
    requires: []
    files:
      - apis/sync_classify.py
      - engines/imagenet_classes.py
      - engines/yolo_cls.py
      - scripts/run_classify.py
      - scripts/test_sync_classify.py
      - tasks/classification.py
      - tests/test_sync_classify.py
      - tests/test_yolo_cls_engine.py
    requirements:
      - numpy>=1.26
      - onnxruntime>=1.17
  pipeline:
    requires: [detect, cls]
    files:
      - apis/sync_pipeline.py
      - scripts/run_pipeline.py
      - scripts/test_sync_pipeline.py
      - tasks/pipeline.py
      - tests/test_sync_pipeline.py
  embed:
    requires: []
    files:
      - docs/embedding.md
      - engines/dinov2.py
      - scripts/export_dinov2.py
      - tasks/embedding.py
    requirements:
      - numpy>=1.26
      - onnxruntime>=1.17
  dedup:
    requires: [embed]
    files:
      - apis/sync_dedup.py
      - scripts/run_dedup.py
      - scripts/test_sync_dedup.py
      - tasks/dedup.py
      - tests/test_dedup.py
  async:
    requires: [detect]
    files:
      - apis/async_detect_callback.py
      - apis/async_detect_query.py
      - celery_app.py
      - requirements-async.txt
      - scripts/callback_receiver.py
      - scripts/test_async_detect_callback.py
      - scripts/test_async_detect_query.py
      - start_celery.sh
      - tasks/detection_callback.py
      - tasks/detection_query.py
      - tests/test_app.py
      - tests/test_async_detect_callback.py
      - tests/test_async_detect_query.py
      - utils/redis_store.py
  vlm:
    requires: [async]
    files:
      - apis/async_vlm_query.py
      - scripts/run_vlm.py
      - scripts/test_async_vlm_query.py
      - tasks/vlm.py
      - tasks/vlm_query.py
      - tests/test_async_vlm_query.py
      - tests/test_vlm.py
  agent:
    requires: [detect, async]
    files:
      - apis/async_agent_query.py
      - docs/agent.md
      - scripts/run_agent.py
      - tasks/agent.py
      - tasks/agent_query.py
      - tests/test_agent.py
      - tests/test_async_agent_query.py
  search:
    requires: [embed, async]
    files:
      - apis/async_search_check.py
      - apis/async_search_query.py
      - scripts/build_gallery.py
      - scripts/run_search.py
      - tasks/search.py
      - tasks/search_check_query.py
      - tasks/search_query.py
      - tests/test_async_search_check.py
      - tests/test_async_search_query.py
      - tests/test_search.py

shared:
  - any_of: [detect, seg, cls, embed]
    files:
      - engines/base.py
      - engines/registry.py
      - gunicorn.conf.py
      - models/.gitkeep
      - models/registry.example.yaml
      - scripts/check_capability.py
      - scripts/preflight_models.py
      - start.sh
      - utils/errors.py
    requirements:
      - PyYAML>=6.0,<7.0
      - gunicorn>=21.2,<24.0
  - any_of: [detect, seg, cls, pipeline, embed, dedup, async, vlm, agent, search]
    files:
      - apis/schemas.py
      - utils/image.py
    requirements:
      - Pillow>=10.0
      - requests>=2.31
  - any_of: [detect, seg, cls]
    files:
      - scripts/export_yolo.py

