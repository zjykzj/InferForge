# Bootstrap assembly manifest — the positive include-list for selective
# project generation (docs/workflow/bootstrap.md §2). Consumed by
# scripts/assemble.py; guarded by tests/test_bootstrap_manifest.py
# (every tracked repo file is claimed exactly once; marker blocks pair up).
#
# Selection model:
#   base         — always copied: the serving shell (envelope, logging,
#                  metrics, auth, rate limit, request-id, health probes,
#                  registry) — NO capability. The default assembly.
#   capabilities — one file set each; opt-in via --with.
#   shared       — included when ANY of the listed capabilities is selected.
#   features     — deployment/tooling extras; opt-in via --features.
#
# Wiring files (app.py, apis/health.py, engines/registry.py, ...) carry
# `# @inferforge:<name>` ... `# @inferforge:end:<name>` marker blocks for
# capability-specific code; assemble.py drops the blocks of unselected
# capabilities so a generated project never references absent files.

base:
  - .claude/skills/inferforge-add-capability/SKILL.md
  - .claude/skills/inferforge-add-engine/SKILL.md
  - .claude/skills/inferforge-bootstrap/SKILL.md
  - .claude/skills/inferforge-modify-service/SKILL.md
